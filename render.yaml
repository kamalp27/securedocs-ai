# ==============================================================================
# SecureDocs AI — Render Blueprint Deployment Specification
# Defines the FastAPI Backend Web Service (Free Tier) and Static Site.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service (Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: securedocs-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "mkdir -p ./data/uploads ./data/faiss_indices && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Cookie & CSRF Cross-Origin Security (Required for cross-site calls from GitHub Pages / onrender.com)
      - key: REFRESH_COOKIE_NAME
        value: securedocs_refresh_token
      - key: REFRESH_COOKIE_PATH
        value: /api/v1/auth
      - key: REFRESH_COOKIE_HTTPONLY
        value: "true"
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: "none"
      - key: CSRF_COOKIE_NAME
        value: securedocs_csrf_token
      - key: CSRF_HEADER_NAME
        value: X-CSRF-Token
      - key: CSRF_COOKIE_SAMESITE
        value: "none"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "false"
      # Free-Tier Ephemeral Storage Paths (In-container ./data directory)
      - key: DATABASE_URL
        value: sqlite:///./data/securedocs.db
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: FAISS_INDEX_PATH
        value: ./data/faiss_indices/securedocs.index
      # AI Provider: Extractive CPU grounded provider (deterministic, zero external GPU dependency)
      - key: DEFAULT_QA_PROVIDER
        value: deterministic_extractive
      # CORS: Configured for GitHub Pages origin and local development
      - key: BACKEND_CORS_ORIGINS
        value: '["https://kamalp27.github.io", "http://localhost:5173"]'

  # ----------------------------------------------------------------------------
  # 2. React + TypeScript + Vite Frontend Static Site (Optional alternative to Pages)
  # ----------------------------------------------------------------------------
  - type: web
    name: securedocs-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        sync: false
