[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securedocs-ai-backend"
version = "0.1.0"
description = "AI-Powered Secure Document Management System Backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "SecureDocs Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0,<0.116.0",
    "uvicorn[standard]>=0.28.0,<0.33.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "email-validator>=2.0.0,<3.0.0",
    "python-multipart>=0.0.9,<0.0.20",
    "sqlalchemy>=2.0.28,<2.1.0",
    "alembic>=1.13.1,<1.15.0",
    "pwdlib[argon2]>=0.3.1,<1.0.0",
    "pyjwt[crypto]>=2.10.0,<3.0.0",
    "pypdf>=4.1.0,<5.1.0",
    "python-docx>=1.1.0,<1.2.0",
    "sentence-transformers>=2.5.1,<3.4.0",
    "faiss-cpu>=1.8.0,<2.0.0",
    "numpy>=1.26.0,<2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.5,<0.26.0",
    "httpx>=0.27.0,<0.29.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "real_model: Tests that exercise the actual local SentenceTransformer model",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]
